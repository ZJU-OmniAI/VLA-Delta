# Paths are relative to this file. Use --dataset_registry for a private copy.
droid_mixed:
  dataset_type: vla
  dataset_adapter: mixed_pretraining
  dataset_kind: droid
  embedded_images: false
  video_backend: pyav
  target_text_field: train_data
  camera_keys:
  - observation.images.exterior_1_left
  - observation.images.wrist_left
  stats_key: droid
  use_quantile: true
  sample_ratio: 1.0
  dataset_path: data/pretrain/droid
  aux_dataset_identity: droid
  optical_flow_data_root: data/pretrain/droid/optical_flow/droid
  optical_flow_manifest: manifest.jsonl
  flow_delta_frames: 20
  annotation_root: data/annotations/droid
  allow_unannotated_episodes: true
