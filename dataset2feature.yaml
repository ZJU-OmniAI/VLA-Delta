libero_wo_ecot_pt:
  # Set your own training dataset root; normalization is read from <dataset_path>/meta/stats.json.
  dataset_path: data/libero
  dataset_type: vla
  sample_ratio: 1.0
  use_quantile: true
robotwin_aloha_agilex:
  # Converted LeRobot v2 training data; must match evaluation's native 14D joint actions.
  dataset_path: data/robotwin
  dataset_type: vla
  dataset_adapter: lerobot_v2
  benchmark: robotwin
  sample_ratio: 1.0
  use_quantile: true
  video_backend: pyav
