name: release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'PyYAML>=6,<7'
      - run: python -m compileall -q scripts utils model policies evaluation lerobot train_vla.py server.py
      - run: python scripts/evaluate.py --config configs/eval/libero.yaml --dry-run
