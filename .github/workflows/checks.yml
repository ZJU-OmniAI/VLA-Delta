name: release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'numpy<3' 'pyarrow>=15,<22' 'PyYAML>=6,<7'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -v
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'PyYAML>=6,<7'
      - run: python -m compileall -q scripts utils model policies evaluation lerobot train_vla.py server.py
      - run: python scripts/evaluate.py --config configs/eval/libero.yaml --dry-run
      - name: Download latest RoboTwin source
        run: |
          mkdir -p third_party
          git clone --filter=blob:none https://github.com/RoboTwin-Platform/RoboTwin.git third_party/robotwin
      - run: python scripts/evaluate.py --config configs/eval/robotwin.yaml --tasks adjust_bottle --dry-run
