name: Deploy project page

on:
  push:
    branches: [main]
    paths:
      - 'docs/project-page/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public website files
        run: |
          mkdir -p _site
          rsync -a --files-from=docs/project-page/publish-files.txt docs/project-page/ _site/
          python3 docs/project-page/scripts/check-site.py --site-root _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
