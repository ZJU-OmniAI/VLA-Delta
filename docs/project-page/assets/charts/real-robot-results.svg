<?xml version="1.0" encoding="UTF-8"?>
<svg class="real-robot-chart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1928 607" width="1928" height="607" role="group" aria-labelledby="robot-chart-title robot-chart-description">
  <title id="robot-chart-title">Experimental Results — real-robot success rates</title>
  <desc id="robot-chart-description">Success Rate (%), from 0 to 100. Four methods across five tasks and their average. Hover, focus or tap a bar to show its value. Each task has 40 evaluation episodes.</desc>
  <style>
    .real-robot-chart { display: block; width: 100%; height: auto; font-family: "Times New Roman", Times, serif; color: #222; }
    .real-robot-chart text { fill: #222; }
    .real-robot-chart .chart-bar { outline: none; cursor: pointer; }
    .real-robot-chart .bar-mark { transform-origin: 0 0; transition: transform 180ms ease; }
    .real-robot-chart .bar-value { opacity: 0; transform: translateY(6px); transition: opacity 160ms ease, transform 180ms ease; pointer-events: none; paint-order: stroke fill; stroke: #fefefe; stroke-width: 5px; stroke-linejoin: round; }
    .real-robot-chart .chart-bar.is-active .bar-mark,
    .real-robot-chart:not([data-enhanced]) .chart-bar:hover .bar-mark,
    .real-robot-chart:not([data-enhanced]) .chart-bar:focus .bar-mark { transform: scale(1.06, 1.025); }
    .real-robot-chart .chart-bar.is-active .bar-value,
    .real-robot-chart:not([data-enhanced]) .chart-bar:hover .bar-value,
    .real-robot-chart:not([data-enhanced]) .chart-bar:focus .bar-value { opacity: 1; transform: translateY(0); }
    .real-robot-chart .chart-bar:focus-visible .bar-mark rect { stroke: #1c3d60; stroke-width: 3px; }
    @media (prefers-reduced-motion: reduce) { .real-robot-chart .bar-mark, .real-robot-chart .bar-value { transition: none; } }
  </style>
  <defs>
    <pattern id="robot-blue-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#418cdd"/>
      <circle cx="3" cy="3" r="1.15" fill="#e4effb"/>
      <circle cx="9" cy="9" r="1.15" fill="#e4effb"/>
    </pattern>
    <filter id="robot-chart-shadow" x="-20%" y="-30%" width="140%" height="190%">
      <feDropShadow dx="0" dy="5" stdDeviation="2.5" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <marker id="robot-axis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#111"/>
    </marker>
  </defs>
