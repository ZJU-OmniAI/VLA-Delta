portable_run: true
dataset_registry: ../../dataset2feature.yaml
action_expert_config_path: ${VLA_BASE_MODEL}/action_expert_config.json
dataset_entries:
- droid_mixed
- household_mixed
- tabletop_mixed
- rh20t_mixed
dataset_sample_ratios:
- 1.0
- 1.0
- 1.0
- 1.0
aux_dataset_config: ${VLA_PREPARED_ROOT}/aux_dataset_routes.json
use_difference_query: true
num_difference_queries: 32
num_flow_queries: 16
vlm_attention_backend: sdpa
action_horizon: 10
window_size: 1
max_pad_state_and_action_length: 64
max_length: 1024
epochs: 16
per_device_train_batch_size: 16
gradient_accumulation_steps: 2
expected_global_batch_size: 128
seed: 42
peak_learning_rate: 1.0e-05
min_lr_rate: 0.1
warmup_ratio: 0.08
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-06
lr_scheduler: cosine
dataloader_num_workers: 4
prefetch_factor: 2
save_optimizer_and_lr_states: true
component_optimizer_groups: true
component_update_diagnostics: inactive
batch_metric_reductions: true
fast_resume_data_skip: true
logging_steps: 10
wandb_project: ""
wandb_group: ""
wandb_failure_policy: ""
