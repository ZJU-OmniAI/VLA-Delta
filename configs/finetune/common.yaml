portable_run: true
dataset_registry: ../../dataset2feature.yaml
action_expert_config_path: ${VLA_PRETRAIN_CHECKPOINT}/action_expert_config.json
dataset_sample_ratios:
- 1.0
use_difference_query: true
num_difference_queries: 32
num_flow_queries: 16
vlm_attention_backend: sdpa
window_size: 1
max_pad_state_and_action_length: 64
max_length: 1024
epochs: 8
per_device_train_batch_size: 16
gradient_accumulation_steps: 1
expected_global_batch_size: 64
seed: 42
peak_learning_rate: 2.0e-05
min_lr_rate: 0.1
warmup_ratio: 0.08
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-06
lr_scheduler: cosine
dataloader_num_workers: 4
prefetch_factor: 2
save_optimizer_and_lr_states: true
component_optimizer_groups: false
batch_metric_reductions: true
logging_steps: 10
wandb_project: ""
wandb_failure_policy: ""
vlm_name_or_path: ${VLA_PRETRAIN_CHECKPOINT}
action_expert_name_or_path: ${VLA_PRETRAIN_CHECKPOINT}
loss_type: action
checkpoint_load_purpose: downstream_finetune
tune_vlm: true
tune_action_expert: true
vlm_loss_weight: 0.0
action_expert_loss_weight: 1.0
save_step_interval: 2000
